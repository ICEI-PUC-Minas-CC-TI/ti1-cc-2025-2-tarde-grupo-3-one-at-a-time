<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <title>Pomodoro</title>
</head>

<body>
    <div class="card cardone">
        <div class="pombutt">
            <button class="cardbtn">Pomodoro</button>
            <button class="cardbtn">Short Break</button>
            <button class="cardbtn">Long Break</button>
        </div>
        <div class="timer">25:00</div>
        <button class="beginbtn">Comece</button>
    </div>
    <input id="taskinput" class="rest" type="text" placeholder="Tarefas"></input>

    <div class="card tarefas">
        <label class="task">
            <span class="task-name">Tarefa #1</span>
            <input type="checkbox">
            <span class="checkmark"></span>
        </label>
        <label class="task">
            <span class="task-name">Tarefa #1</span>
            <input type="checkbox">
            <span class="checkmark"></span>
        </label>
        <label class="task">
            <span class="task-name">Tarefa #1</span>

            <span class="checkmark"></span>
        </label>
    </div>
    <button id="speciallittlefuck" class="addbtn">Adicionar Tarefa</button>
</body>
