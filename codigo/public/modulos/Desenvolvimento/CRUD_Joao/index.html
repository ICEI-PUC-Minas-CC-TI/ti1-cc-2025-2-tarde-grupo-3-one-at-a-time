<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Document</title>
</head>

<body>
    <header class="mb-5">
        <nav class="navbar bg-dark">
            <div class="container-fluid">
                <span class="navbar-brand mb-1 h1 text-white">One At Time</span>
                <button class="otherbtn">Log in</button>
            </div>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="main_text">
                <h1 class="maintext">
                    Tudo que você<br>
                    estudante precisa <br>
                    para organizar <br>
                    suas tarefas em <br>
                    um só lugar!
                </h1>
            </div>
            <div class="main_buttons">
                <div class="container">
                    <div class="cardbtn">
                        <button class="mainbtn">
                            <img src="clock.png" alt="clock icon">
                            <div class="namebtn">
                                <h3 class>Cronometro Pomodoro</h3>
                            </div>
                        </button>
                    </div>
                    <div class="cardbtn">
                        <button class="mainbtn">
                            <img src="check.png" alt="check icon">
                            <div class="namebtn">
                                <h3>Lista de afazeres</h3>
                            </div>
                        </button>
                    </div>
                </div>
                <div class="cardbtn">
                    <button class="mainbtn">
                        <img src="calendar.png" alt="calendar icon">
                        <div class="namebtn">
                            <h3>Calendario</h3>
                        </div>
                    </button>
                </div>
            </div>
        </div>
        <footer class="bg-dark text-white text-center py-3">

            <p class="mb-0">© 2025 One At Time. Todos os direitos reservados.</p>

        </footer>
    </main>
</body>

</html>
