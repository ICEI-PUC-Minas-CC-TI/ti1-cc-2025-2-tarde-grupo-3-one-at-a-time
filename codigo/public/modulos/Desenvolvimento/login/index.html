<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevHub | Dashboard e Usuários</title>
    <link rel="stylesheet" href="../../assets/css/style.css"> 
    
    <script src="../login-new/auth.js"></script>
    <script src="../login-new/api.js"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    
    <script>
        // Variáveis globais para armazenar os dados do usuário (se necessário)
        let todosUsuarios = [];
        let tarefasUsuario = [];

        // ----------------------------------------------------
        // 1. Funções de Exibição
        // ----------------------------------------------------
        function exibeUsuarios() {
            // Usa a lista global 'todosUsuarios' preenchida pela API
            let listaUsuarios = '';
            const tbody = document.getElementById("table-usuarios");
            tbody.innerHTML = ''; // Limpa antes de popular

            if (todosUsuarios.length === 0) {
                 tbody.innerHTML = '<tr><td colspan="3">Nenhum usuário cadastrado.</td></tr>';
                 return;
            }

            for (i = 0; i < todosUsuarios.length; i++) {
                let usuario = todosUsuarios[i];
                // Exibimos nome, login (se existisse no db.json) e e-mail
                listaUsuarios += `<tr><td scope="row">${usuario.nome}</td><td>${usuario.login || 'N/A'}</td><td>${usuario.email}</td></tr>`;
            }

            // Substitui as linhas do corpo da tabela
            tbody.innerHTML = listaUsuarios;
        }

        function exibeTarefas() {
            // Usa a lista global 'tarefasUsuario'
            let listaTarefas = '';
            const tbody = document.getElementById("table-tarefas");
            tbody.innerHTML = '';

            if (tarefasUsuario.length === 0) {
                 tbody.innerHTML = '<tr><td colspan="5">Nenhuma tarefa encontrada para este usuário.</td></tr>';
                 return;
            }

            for (i = 0; i < tarefasUsuario.length; i++) {
                let tarefa = tarefasUsuario[i];
                listaTarefas += `<tr><td scope="row">${tarefa.nome}</td><td>${tarefa.descricao}</td><td>${tarefa.prioridade}</td><td>${tarefa.vencimento}</td><td>${tarefa.feito ? 'Sim' : 'Não'}</td></tr>`;
            }
            tbody.innerHTML = listaTarefas;
        }

        // ----------------------------------------------------
        // 2. Funções de Carga de Dados (Adaptadas para API)
        // ----------------------------------------------------
        async function fetchTodosUsuarios() {
            try {
                // *** MUDANÇA CRUCIAL: Busca a coleção completa /usuarios
                const response = await fetch(`${API_URL_BASE}/usuarios`);
                if (!response.ok) throw new Error('Erro ao buscar lista de usuários.');
                
                todosUsuarios = await response.json();
                exibeUsuarios(); // Chama a função de exibição após carregar

            } catch (error) {
                console.error('Erro ao carregar usuários:', error.message);
                document.getElementById("table-usuarios").innerHTML = `<tr><td colspan="3" class="text-danger">Erro ao carregar: ${error.message}</td></tr>`;
            }
        }

        async function fetchTarefasUsuario() {
            try {
                // *** Busca tarefas APENAS do usuário logado (usando api.js)
                tarefasUsuario = await getItensDoUsuario('tarefas'); 
                exibeTarefas();
            } catch (error) {
                console.error('Erro ao carregar tarefas do usuário:', error.message);
                document.getElementById("table-tarefas").innerHTML = `<tr><td colspan="5" class="text-danger">Erro ao carregar tarefas: ${error.message}</td></tr>`;
            }
        }


        function initPage() {
            const usuarioCorrente = getUsuarioLogado();

            // 1. Verifica se está logado (o Guard deveria fazer isso, mas é bom checar)
            if (!usuarioCorrente) {
                 window.location.href = 'login.html';
                 return;
            }

            // 2. Associa a função de logout ao botão
            document.getElementById('btn_logout').addEventListener('click', logout); // Usa logout do auth.js

            // 3. Informa o nome do usuário logado
            document.getElementById('nomeUsuario').innerHTML = usuarioCorrente.nome;

            // 4. Carrega Usuários (todos)
            fetchTodosUsuarios();

            // 5. Carrega Tarefas, Eventos e Timers do usuário logado
            fetchTarefasUsuario();
            // carregarEventos(); // Adicionar fetch correspondente se for exibir
            // carregarTimer(); // Adicionar fetch correspondente se for exibir
        }

        // Associa ao evento de carga da página
        window.addEventListener('load', initPage);
    </script>

</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Olá <span id="nomeUsuario">, seja bem-vindo!</span></h1>
        <button id="btn_logout" class="btn btn-danger mb-4">Efetuar Logout</button>

        <h2>Todos os Usuários Cadastrados</h2>
        <div class="row">
            <div class="col-sm-12">
                <table id="grid-usuarios" class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th scope="col">Nome</th>
                            <th scope="col">Login</th>
                            <th scope="col">E-mail</th>
                        </tr>
                    </thead>
                    <tbody id="table-usuarios">
                        <tr>
                            <td colspan="3">Carregando usuários...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <hr class="my-5">
        
        <h2>Minhas Tarefas</h2>
        <div class="row">
            <div class="col-sm-12">
                <table id="grid-tarefas" class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th scope="col">Nome</th>
                            <th scope="col">Descrição</th>
                            <th scope="col">Prioridade</th>
                            <th scope="col">Vencimento</th>
                            <th scope="col">Feito</th>
                        </tr>
                    </thead>
                    <tbody id="table-tarefas">
                        <tr>
                            <td colspan="5">Carregando tarefas...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
