<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <div class="cardone">
            <h2>Criar / Atualizar Tarefa</h2>
            <form id="taskForm">
                <input type="hidden" id="taskID" value="">

                <label for="id">ID (Para Criar ou Atualizar):</label>
                <input type="text" id="id" required placeholder="ID Único da Tarefa">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" required placeholder="Nome da Tarefa">

                <label for="vencimento">Vencimento:</label>
                <input type="date" id="vencimento" required>

                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" value="Descrição padrão" placeholder="Descrição">

                <label for="usuarioID">ID do Usuário:</label>
                <input type="text" id="usuarioID" value="1" placeholder="ID do Usuário">

                <label for="prioridade">Prioridade:</label>

                <select id="prioridade">
                    <option value="ALTA">ALTA</option>
                    <option value="MEDIA" selected>MÉDIA</option>
                    <option value="BAIXA">BAIXA</option>
                </select>

                <label for="feito">Feito:</label>
                <input type="checkbox" id="feito">

                <br><br>
                <button type="submit" id="saveButton">Criar Tarefa</button>
                <button type="button" onclick="resetForm()">Limpar</button>
            </form>
        </div>

        <div class="cardone">
            <h2>Lista de Tarefas</h2>
            <button onclick="fetchTasks()">Recarregar</button>
            <ul id="taskList">
                <li>Nenhuma tarefa carregada.</li>
            </ul>
        </div>

        <div class="cardone">
            <h2>Deletar Tarefa</h2>
            <label for="deleteID">ID da Tarefa a ser Deletada:</label>
            <input type="text" id="deleteID" placeholder="ID da Tarefa">
            <button onclick="deleteTaskById()">Deletar</button>
        </div>

    </div>

    <script src="app_task.js"></script>
</body>

</html>
