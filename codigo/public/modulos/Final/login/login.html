<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login - DevHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>

<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <i class="fas fa-user-circle fa-3x text-secondary"></i>
            <h3 class="mt-2">Entrar</h3>
        </div>

        <div id="login-error" class="alert alert-danger d-none d-flex align-items-center" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <div id="login-error-msg">
            </div>
        </div>

        <form id="form-login" novalidate>
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="senha" class="form-control" placeholder="******" required>
                </div>
            </div>
            <button type="submit" id="btn-entrar" class="btn btn-primary w-100">
                Entrar
            </button>
        </form>

        <div class="mt-3 text-center">
            <p class="mb-1">Não tem conta? <a href="cadastro_usuario.html" class="fw-bold">Cadastre-se</a></p>
            <a href="index.html" class="text-decoration-none small text-secondary">Voltar para Home</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/login/auth.js"></script>

    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();

            const emailInput = document.getElementById('email');
            const senhaInput = document.getElementById('senha');
            const errorBox = document.getElementById('login-error');
            const errorMsg = document.getElementById('login-error-msg');
            const btnEntrar = document.getElementById('btn-entrar');

            errorBox.classList.add('d-none');
            emailInput.classList.remove('is-invalid');
            senhaInput.classList.remove('is-invalid');

            const textoOriginal = btnEntrar.innerText;
            btnEntrar.disabled = true;
            btnEntrar.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Entrando...';

            const email = emailInput.value;
            const senha = senhaInput.value;

            await new Promise(r => setTimeout(r, 500));

            const resultado = await login(email, senha);

            if (resultado.success) {
                window.location.href = '../../../index.html';
            } else {
                btnEntrar.disabled = false;
                btnEntrar.innerText = textoOriginal;

                errorMsg.innerText = resultado.message;
                errorBox.classList.remove('d-none');

                emailInput.classList.add('is-invalid');
                senhaInput.classList.add('is-invalid');
            }
        });

        const inputs = document.querySelectorAll('.form-control');
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                document.getElementById('login-error').classList.add('d-none');
                input.classList.remove('is-invalid');
            });
        });
    </script>
</body>

</html>
