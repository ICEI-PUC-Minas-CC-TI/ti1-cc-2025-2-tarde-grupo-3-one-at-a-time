<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - One At a Time</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>

<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card shadow p-4" style="max-width: 500px; width: 100%;">
        <div class="text-center mb-4">
            <i class="fas fa-user-plus fa-3x text-primary"></i>
            <h3 class="mt-2">Criar Conta</h3>
            <p class="text-muted">Junte-se à nós</p>
        </div>

        <div id="alert-error" class="alert alert-danger d-none d-flex align-items-center" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <div id="msg-error"></div>
        </div>

        <div id="alert-success" class="alert alert-success d-none d-flex align-items-center" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <div>Cadastro realizado! Redirecionando...</div>
        </div>

        <form id="form-cadastro" novalidate>
            <div class="mb-3">
                <label for="nome" class="form-label">Nome Completo</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" id="nome" class="form-control" placeholder="Seu nome" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" class="form-control" placeholder="exemplo@email.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="senha" class="form-control" placeholder="Mínimo 3 caracteres"
                        minlength="3" required>
                </div>
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" id="btn-cadastrar" class="btn btn-primary">
                    Cadastrar
                </button>
            </div>
        </form>

        <div class="mt-3 text-center">
            <p>Já tem conta? <a href="login.html" class="fw-bold">Faça Login</a></p>
            <a href="index.html" class="text-decoration-none text-secondary small">Voltar para Home</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/login/auth.js"></script>

    <script>
        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nomeInput = document.getElementById('nome');
            const emailInput = document.getElementById('email');
            const senhaInput = document.getElementById('senha');
            const btnCadastrar = document.getElementById('btn-cadastrar');

            const alertError = document.getElementById('alert-error');
            const msgError = document.getElementById('msg-error');
            const alertSuccess = document.getElementById('alert-success');

            alertError.classList.add('d-none');
            alertSuccess.classList.add('d-none');
            [nomeInput, emailInput, senhaInput].forEach(input => input.classList.remove('is-invalid'));

            if (!nomeInput.value || !emailInput.value || !senhaInput.value) {
                mostrarErro("Por favor, preencha todos os campos.");
                return;
            }

            const textoOriginal = btnCadastrar.innerText;
            btnCadastrar.disabled = true;
            btnCadastrar.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Processando...';

            try {
                await new Promise(r => setTimeout(r, 600));

                const checkResponse = await fetch(`${API_URL_BASE}/usuarios?email=${emailInput.value}`);
                const existingUsers = await checkResponse.json();

                if (existingUsers.length > 0) {
                    throw new Error("Este e-mail já está em uso.");
                }

                const novoUsuario = {
                    nome: nomeInput.value,
                    email: emailInput.value,
                    senha: senhaInput.value,
                    admin: false
                };

                const createResponse = await fetch(`${API_URL_BASE}/usuarios`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(novoUsuario)
                });

                if (!createResponse.ok) throw new Error("Erro ao salvar no servidor.");

                btnCadastrar.innerHTML = '<i class="fas fa-check"></i> Sucesso!';
                alertSuccess.classList.remove('d-none');

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);

            } catch (error) {
                btnCadastrar.disabled = false;
                btnCadastrar.innerText = textoOriginal;

                mostrarErro(error.message);

                if (error.message.includes('e-mail')) {
                    emailInput.classList.add('is-invalid');
                }
            }
        });

        function mostrarErro(mensagem) {
            const alertError = document.getElementById('alert-error');
            const msgError = document.getElementById('msg-error');

            msgError.innerText = mensagem;
            alertError.classList.remove('d-none');
        }

        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('input', () => {
                document.getElementById('alert-error').classList.add('d-none');
                input.classList.remove('is-invalid');
            });
        });
    </script>
</body>

</html>
