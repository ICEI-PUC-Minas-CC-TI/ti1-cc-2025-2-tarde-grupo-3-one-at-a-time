<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Histórico de Timers</title>
</head>

<body class="bg-light">

    <script src="../../../assets/js/login/auth.js"></script>
    <script>
        // REDIRECIONA SE NÃO ESTIVER LOGADO
        if (!getUsuarioLogado()) {
            window.location.href = '../../Final/login/login.html';
        }
    </script>
    <script src="../../../assets/js/login/api.js"></script>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="../../../index.html">
                <i class="fas fa-cubes me-2"></i> One At a Time - Histórico
            </a>
            <a href="../../../index.html" class="btn btn-outline-light">Voltar para Home</a>
        </div>
    </nav>
    
    <div class="container d-flex">
        
        <div class="card cardone p-4 shadow-sm me-4" style="min-width: 250px;">
            <button id="historybtn" onclick="window.location.href='pomodoro.html'" class="btn btn-warning mb-4">
                <i class="fas fa-clock"></i> Voltar para Pomodoro
            </button>
            <div class="pombutt">
                <h4 class="mb-3">Tipo</h4>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="type-mode" id="type-all" value="all" checked>
                    <label class="form-check-label" for="type-all">Todos</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="type-mode" id="type-pomodoro" value="pomodoro">
                    <label class="form-check-label" for="type-pomodoro">Pomodoro</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="type-mode" id="type-shortBreak" value="shortBreak">
                    <label class="form-check-label" for="type-shortBreak">Short Break</label>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="radio" name="type-mode" id="type-longBreak" value="longBreak">
                    <label class="form-check-label" for="type-longBreak">Long Break</label>
                </div>
                
                <h4 class="mb-3">Ordenar por</h4>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="sort-mode" id="sort-recent" value="recent" checked>
                    <label class="form-check-label" for="sort-recent">Recente</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="sort-mode" id="sort-duration" value="duration">
                    <label class="form-check-label" for="sort-duration">Duração</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="sort-mode" id="sort-type" value="type">
                    <label class="form-check-label" for="sort-type">Tipo</label>
                </div>
            </div>
        </div>

        <div class="card tarefas flex-grow-1 p-4 shadow-sm">
            <h3 class="mb-4">Histórico de Sessões</h3>
            <p id="loading-msg">Carregando histórico...</p>
        </div>
    </div>
    
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous">
</script>
<script src="../../../assets/js/pomodoro/inf.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js" integrity="sha512-..." crossorigin="anonymous"></script>

</html>
