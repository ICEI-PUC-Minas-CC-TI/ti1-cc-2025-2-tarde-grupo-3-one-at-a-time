<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="custom_bootstrap.css"> 

    <title>Pomodoro Timer - DevHub</title>
    
    <style>
        /* Estilos customizados mínimos para o layout centralizado */
        .timer-container {
            max-width: 500px;
            margin: 0 auto;
        }
        #timer {
            font-size: 6rem; /* Aumenta o tamanho do timer */
            font-weight: bold;
            color: var(--bs-primary); /* Usa a cor primária */
        }
        .history-list {
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>

<body class="bg-light">
    <script src="../../../assets/js/login/auth.js"></script>
    <script>
        // REDIRECIONA SE NÃO ESTIVER LOGADO
        if (!getUsuarioLogado()) {
            window.location.href = '../../Final/login/login.html';
        }
    </script>
    <script src="../../../assets/js/login/api.js"></script>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="../../../index.html">
                <i class="fas fa-cubes me-2"></i> DevHub - Timers
            </a>
            <div class="d-flex">
                 <a href="inf.html" class="btn btn-outline-warning me-2">
                    <i class="fas fa-history"></i> Histórico
                </a>
                <a href="../../../index.html" class="btn btn-outline-light">Voltar para Home</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-5 timer-container">
        
        <div class="card shadow-lg p-4 mb-4 text-center">
            
            <h2 class="card-title mb-4 text-primary">Cronômetro Pomodoro</h2>

            <div class="pombutt mb-4 d-flex justify-content-center flex-wrap gap-2">
                <label><input type="radio" name="pomodoro-mode" value="pomodoro"><span>Pomodoro (25)</span></label>
                <label><input type="radio" name="pomodoro-mode" value="shortBreak"><span>Pausa Curta (5)</span></label>
                <label><input type="radio" name="pomodoro-mode" value="longBreak"><span>Pausa Longa (15)</span></label>
            </div>

            <div class="input-group mb-4">
                <input type="text" id="sessionTitle" class="form-control" placeholder="Título da Sessão (Ex: Estudo de React)" aria-label="Título da Sessão">
            </div>

            <div class="mb-4">
                 <input type="number" class="timer form-control form-control-lg text-center" placeholder="25" min="1" max="60" step="1">
                 <h1 id="timer" class="display-1" style="display: none;">25:00</h1>
            </div>

            <div class="button-container d-grid gap-2 d-md-block">
                <button type="button" id="begin" class="btn btn-primary btn-lg px-4">
                    <i class="fas fa-play"></i> Começar
                </button>
                <button type="button" id="pause" class="btn btn-warning btn-lg px-4" style="display: none;">
                    <i class="fas fa-pause"></i> Pausar
                </button>
                <button type="button" id="cancel" class="btn btn-danger btn-lg px-4" style="display: none;">
                    <i class="fas fa-times"></i> Cancelar
                </button>
            </div>
        </div>

        <div class="card shadow-sm p-4 mt-4">
            <h4 class="card-title text-secondary mb-3">Últimos Timers Concluídos</h4>
            
            <div class="history-list list-group list-group-flush" id="history-container">
                <div class="list-group-item d-flex justify-content-between align-items-center" id="history1">
                    <span class="text-muted">Carregando histórico...</span>
                </div>
                <div class="list-group-item d-flex justify-content-between align-items-center d-none" id="history2"></div>
                <div class="list-group-item d-flex justify-content-between align-items-center d-none" id="history3"></div>
            </div>
             <button type="button" id="speciallittlefuck" class="btn btn-outline-secondary mt-3" onclick="stopTimer();">Recomeçar sessão</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/pomodoro/script.js"></script>

</body>
</html>
