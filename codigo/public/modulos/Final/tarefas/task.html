<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../assets/css/custom_bootstrap.css"> 

</head>
<body class="bg-light">
    <script src="../../../assets/js/login/auth.js"></script>
    <script>
        // REDIRECIONA SE NÃO ESTIVER LOGADO
        if (!getUsuarioLogado()) {
            window.location.href = '../../Final/login/login.html';
        }
    </script>
    <script src="../../../assets/js/login/api.js"></script>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container-fluid">
            <h1 class="navbar-brand h1 mb-0"><i class="fas fa-tasks me-2"></i> Gerenciador de Tarefas</h1>
            <a href="../../../index.html" class="btn btn-outline-light">Voltar para Home</a>
        </div>
    </nav>

    <div class="container mt-4">
        
        <div class="row g-4">
            
            <div class="col-lg-8">
                
                <div class="form-section card shadow-sm p-4 mb-4">
                    <h2 class="card-title text-primary mb-3">Criar / Atualizar Tarefa</h2>
                    <form id="taskForm">
                        <input type="hidden" id="taskID" value="">
                        
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome:</label>
                            <input type="text" id="nome" class="form-control" required placeholder="Nome da Tarefa">
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="vencimento" class="form-label">Vencimento:</label>
                                <input type="date" id="vencimento" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label for="prioridade" class="form-label">Prioridade:</label>
                                <select id="prioridade" class="form-select">
                                    <option value="ALTA">ALTA</option>
                                    <option value="MEDIA" selected>MÉDIA</option>
                                    <option value="BAIXA">BAIXA</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="descricao" class="form-label">Descrição:</label>
                            <input type="text" id="descricao" class="form-control" placeholder="Descrição">
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="feito">
                            <label class="form-check-label" for="feito">Tarefa Concluída</label>
                        </div>
                        
                        <div class="d-flex justify-content-end">
                            <button type="button" onclick="resetForm()" class="btn btn-secondary me-2">Limpar Formulário</button>
                            <button type="submit" id="saveButton" class="btn btn-primary">Criar Tarefa</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-4">
                
                <div class="list-section card shadow-sm p-4 mb-4">
                    <h2 class="card-title text-secondary mb-3">Lista de Tarefas</h2>
                    <button onclick="fetchTasks()" class="btn btn-success mb-3"><i class="fas fa-sync-alt"></i> Recarregar Lista</button>
                    <ul id="taskList" class="list-group list-group-flush">
                        <li class="list-group-item text-muted">Nenhuma tarefa carregada.</li>
                    </ul>
                </div>
                
                <div class="form-section card shadow-sm p-4">
                    <h2 class="card-title text-danger mb-3">Deletar por ID</h2>
                    <label for="deleteID" class="form-label">ID da Tarefa a ser Deletada:</label>
                    <input type="text" id="deleteID" class="form-control mb-3" placeholder="ID da Tarefa">
                    <button onclick="deleteTaskById()" class="btn btn-danger">Deletar</button>
                </div>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/tarefas/app_task.js"></script>
</body>
</html>
