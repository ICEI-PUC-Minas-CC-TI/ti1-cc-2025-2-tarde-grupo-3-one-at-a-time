<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas em Cards</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .container { max-width: 1200px; margin: 20px auto; }
        
        /* Estilização para Cores e Layout de Card */
        .task-card { 
            border: 1px solid #ccc; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1); 
            cursor: pointer; 
            transition: all 0.3s;
            margin-bottom: 15px; /* Adiciona espaçamento para empilhamento */
            border-left: 5px solid; /* Linha de prioridade */
        }
        
        /* CORES DE PRIORIDADE */
        .task-card.ALTA { border-color: #dc3545; background-color: #f8d7da; }
        .task-card.MEDIA { border-color: #ffc107; background-color: #fff3cd; }
        .task-card.BAIXA { border-color: #28a745; background-color: #d4edda; }
        
        /* Efeitos e Status */
        .task-card.completed { opacity: 0.6; text-decoration: line-through; }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .card-details { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .task-card.expanded .card-details { max-height: 200px; transition: max-height 0.3s ease-in; }
    </style>
</head>
<body class="bg-light">
    <script src="../../../assets/js/login/auth.js"></script>
    <script>
        // REDIRECIONA SE NÃO ESTIVER LOGADO
        if (!getUsuarioLogado()) {
            window.location.href = '../../Final/login/login.html';
        }
    </script>
    <script src="../../../assets/js/login/api.js"></script>

    <div class="container mt-5">
        <h1 class="mb-4 text-primary"><i class="fas fa-columns me-2"></i> Lista de Tarefas em Cards</h1>

        <div class="actions d-flex justify-content-between mb-4">
            <a href="../../../index.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Voltar para Home
            </a>
            <button onclick="fetchTasks()" class="btn btn-success">
                <i class="fas fa-sync-alt"></i> Recarregar Lista de Cards
            </button>
        </div>

        <div id="tasksContainer">
            <p>Carregando tarefas...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/tarefas/app_cards.js"></script>
</body>
</html>
